name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install only core dependencies for testing (avoid heavy ML)
        pip install pytest pytest-mock torch numpy Pillow pyyaml transformers diffusers moviepy faster-whisper onnxruntime mediapipe librosa pydub static-ffmpeg f5-tts demucs gfpgan facexlib
        
    - name: Run unit tests
      run: |
        export PYTHONPATH=.
        pytest tests/
